<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Travel photos by Riley Brown.">
    <title>travel — riley brown</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <a class="back" href="/">&larr; riley brown</a>

    <h1>travel</h1>
    <p class="lead">some places i've been. click a photo for the full-size version.</p>

    <!-- ADD A PHOTO:
         1. drop the image in  /images/travel/
         2. copy a <figure> block, point <a href> and <img src> at your file
         3. write the place name in <figcaption>
         Photos keep their own shape, so mixing portrait and landscape is fine. -->

    <div class="gallery">

        <figure>
            <a href="/images/travel/budapest.jpg" target="_blank" rel="noopener">
                <img src="/images/travel/budapest.jpg" alt="Budapest, Hungary" loading="lazy">
            </a>
            <figcaption>Budapest, Hungary</figcaption>
        </figure>

        <figure>
            <a href="/images/travel/place-two.jpg" target="_blank" rel="noopener">
                <img src="/images/travel/place-two.jpg" alt="Place name" loading="lazy">
            </a>
            <figcaption>Place name</figcaption>
        </figure>

        <figure>
            <a href="/images/travel/place-three.jpg" target="_blank" rel="noopener">
                <img src="/images/travel/place-three.jpg" alt="Place name" loading="lazy">
            </a>
            <figcaption>Place name</figcaption>
        </figure>

    </div>

</body>
</html>
