<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cv editor</title>
<style>
  :root { --line:#ddd; --muted:#666; --link:#0033cc; --bg:#fff; --flag:#c22e22; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 Helvetica, Arial, sans-serif; color:#000; background:var(--bg);
         display:grid; grid-template-columns:190px 1fr; grid-template-rows:1fr auto; height:100vh; }
  nav { border-right:1px solid var(--line); padding:18px 0; overflow-y:auto; }
  nav h1 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
           margin:0 0 12px 18px; font-weight:normal; }
  nav button { display:block; width:100%; text-align:left; padding:6px 18px; border:0;
               background:none; font:inherit; cursor:pointer; color:#000; }
  nav button:hover { background:#f2f2f2; }
  nav button.on { font-weight:bold; border-left:3px solid var(--link); padding-left:15px; }
  nav .count { color:var(--muted); font-size:12px; }
  main { overflow-y:auto; padding:22px 26px 40px; }
  main h2 { font-size:19px; margin:0 0 4px; }
  main .hint { color:var(--muted); margin:0 0 18px; }
  .entry { border:1px solid var(--line); padding:14px 16px; margin-bottom:14px; }
  .entry-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .entry-head strong { flex:1; font-size:15px; }
  .entry-head button, .rowbtn { font:12px/1 Helvetica, Arial, sans-serif; padding:5px 9px;
    border:1px solid var(--line); background:#fff; cursor:pointer; }
  .entry-head button:hover, .rowbtn:hover { background:#f2f2f2; }
  .del:hover { background:#fde8e6; border-color:var(--flag); color:var(--flag); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  label .req { color:var(--flag); }
  input[type=text], textarea, select { width:100%; font:13px Helvetica, Arial, sans-serif;
    padding:5px 7px; border:1px solid var(--line); background:#fff; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--link); outline-offset:-1px; }
  textarea { min-height:62px; resize:vertical; }
  .wide { grid-column:1/-1; }
  .check { display:flex; align-items:center; gap:7px; font-size:13px; color:#000; }
  .check input { margin:0; }
  .sub { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .sub table { width:100%; border-collapse:collapse; }
  .sub td { padding:2px 4px 2px 0; }
  .sub td.narrow { width:1%; white-space:nowrap; }
  footer { grid-column:1/-1; border-top:1px solid var(--line); padding:10px 18px;
           display:flex; align-items:center; gap:12px; }
  footer button { font:13px Helvetica, Arial, sans-serif; padding:7px 15px; border:1px solid #000;
                  background:#fff; cursor:pointer; }
  footer button:hover { background:#f2f2f2; }
  footer button.primary { background:#000; color:#fff; }
  footer button.primary:hover { background:#333; }
  footer button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--muted); flex:1; }
  #status.dirty { color:var(--flag); }
  #log { grid-column:1/-1; border-top:1px solid var(--line); padding:10px 18px; margin:0;
         font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:190px;
         overflow-y:auto; background:#fafafa; display:none; }
  a { color:var(--link); }
</style>
</head>
<body>
<nav><h1>sections</h1><div id="nav"></div></nav>
<main id="main"></main>
<pre id="log"></pre>
<footer>
  <span id="status">loading…</span>
  <a href="/" target="_blank">preview site</a>
  <a href="/resume.pdf" target="_blank">resume.pdf</a>
  <a href="/cv.pdf" target="_blank">cv.pdf</a>
  <button id="save">Save</button>
  <button id="build" class="primary">Save &amp; build</button>
</footer>

<script>
const T = { text:'text', area:'area', bool:'bool', lines:'lines', csv:'csv', kv:'kv', sel:'sel', objs:'objs' };

const SECTIONS = [
  { key:'profile', label:'Profile', kind:'object', hint:'Appears in the header of both documents.',
    fields:[ {k:'name',t:T.text,req:1}, {k:'email',t:T.text}, {k:'email_school',t:T.text},
             {k:'site',t:T.text}, {k:'github',t:T.text}, {k:'phone',t:T.text},
             {k:'location',t:T.text},
             {k:'resume_summary',t:T.area,wide:1,hint:'Optional one-liner at the top of the resume. Leave empty to hide it.'} ] },

  { key:'education', label:'Education', kind:'list', name:e=>e.institution||'(new)',
    blank:{institution:'',degree:'',location:'',start:'',end:'',expected:false,details:[],resume:true},
    fields:[ {k:'institution',t:T.text,req:1}, {k:'degree',t:T.text}, {k:'location',t:T.text},
             {k:'start',t:T.text,hint:'YYYY-MM'}, {k:'end',t:T.text,hint:'YYYY-MM or present'},
             {k:'expected',t:T.bool,hint:'renders "Expected May 2027"'},
             {k:'details',t:T.lines,wide:1,hint:'one line each; CV only'},
             {k:'resume',t:T.bool,hint:'also show on the 1-page resume'} ] },

  { key:'research', label:'Experience', kind:'list', name:e=>e.org||'(new)',
    hint:'Research positions and jobs. Bullets carry most of the weight on the resume.',
    blank:{role:'',org:'',location:'',advisor:'',start:'',end:'',highlights:[],resume:true},
    fields:[ {k:'role',t:T.text,req:1,wide:1}, {k:'org',t:T.text,req:1}, {k:'location',t:T.text},
             {k:'advisor',t:T.text,hint:'CV only'},
             {k:'start',t:T.text,hint:'YYYY-MM'}, {k:'end',t:T.text,hint:'YYYY-MM or present'},
             {k:'highlights',t:T.lines,wide:1,hint:'one bullet per line'},
             {k:'resume',t:T.bool} ] },

  { key:'papers', label:'Papers', kind:'list', name:e=>e.title||'(new)',
    hint:'Feeds the CV and the papers page.',
    blank:{title:'',authors:[],venue:'',status:'preprint',year:'',links:{},resume:true},
    fields:[ {k:'title',t:T.text,req:1,wide:1},
             {k:'authors',t:T.csv,wide:1,hint:'comma separated; your own name is bolded automatically'},
             {k:'venue',t:T.text}, {k:'year',t:T.text},
             {k:'status',t:T.sel,opts:['preprint','in preparation','submitted','published']},
             {k:'links',t:T.kv,wide:1,hint:'label and URL, e.g. arXiv'},
             {k:'resume',t:T.bool} ] },

  { key:'projects', label:'Projects', kind:'list', name:e=>e.name||'(new)',
    hint:'Feeds the CV, the resume and the projects page.',
    blank:{name:'',url:'',blurb:'',tech:'',year:'',resume:true},
    fields:[ {k:'name',t:T.text,req:1}, {k:'url',t:T.text}, {k:'tech',t:T.text,hint:'python, go, …'},
             {k:'year',t:T.text}, {k:'blurb',t:T.area,wide:1,hint:'one line on what it does'},
             {k:'resume',t:T.bool} ] },

  { key:'awards', label:'Awards', kind:'list', name:e=>e.text||'(new)',
    blank:{text:'',detail:'',year:'',resume:true},
    fields:[ {k:'text',t:T.text,req:1}, {k:'detail',t:T.text}, {k:'year',t:T.text}, {k:'resume',t:T.bool} ] },

  { key:'talks', label:'Talks', kind:'list', name:e=>e.text||'(new)',
    blank:{text:'',detail:'',year:''},
    fields:[ {k:'text',t:T.text,req:1}, {k:'detail',t:T.text,hint:'venue'}, {k:'year',t:T.text} ] },

  { key:'teaching', label:'Teaching', kind:'list', name:e=>e.text||'(new)',
    blank:{text:'',detail:'',year:''},
    fields:[ {k:'text',t:T.text,req:1}, {k:'detail',t:T.text}, {k:'year',t:T.text} ] },

  { key:'skills', label:'Skills', kind:'list', name:e=>e.area||'(new)',
    hint:'Resume only. Industry resumes get keyword-matched on this section.',
    blank:{area:'',items:[]},
    fields:[ {k:'area',t:T.text,req:1,hint:'Languages, Tools, …'},
             {k:'items',t:T.lines,wide:1,hint:'one per line'} ] },

  { key:'coursework', label:'Coursework', kind:'list', name:e=>e.area||'(new)',
    hint:'Feeds the CV and the coursework page. Graduate courses are bolded.',
    blank:{area:'',courses:[]},
    fields:[ {k:'area',t:T.text,req:1},
             {k:'courses',t:T.objs,wide:1,
              sub:[ {k:'name',t:T.text}, {k:'code',t:T.text}, {k:'grad',t:T.bool}, {k:'resume',t:T.bool} ],
              blank:{name:'',code:'',grad:false,resume:false} } ] },
];

let data = null, active = 'profile', dirty = false;

const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
};
const label = (f) => {
  const t = f.k.replace(/_/g, ' ');
  const l = el('label', {}, [t]);
  if (f.req) l.append(el('span', { className: 'req', textContent: ' *' }));
  if (f.hint) l.append(el('span', { textContent: ' — ' + f.hint }));
  return l;
};
const touch = () => { dirty = true; paintStatus(); };

function input(obj, f) {
  const wrap = el('div', { className: f.wide ? 'wide' : '' });
  if (f.t === T.bool) {
    const box = el('input', { type: 'checkbox', checked: !!obj[f.k] });
    box.onchange = () => { obj[f.k] = box.checked; touch(); };
    wrap.append(el('div', { className: 'check' }, [box, label(f)]));
    return wrap;
  }
  if (!f.nolabel) wrap.append(label(f));
  let node;
  if (f.t === T.area || f.t === T.lines) {
    node = el('textarea', { value: f.t === T.lines ? (obj[f.k] || []).join('\n') : (obj[f.k] || '') });
    node.oninput = () => {
      obj[f.k] = f.t === T.lines
        ? node.value.split('\n').map(s => s.trim()).filter(Boolean)
        : node.value;
      touch();
    };
  } else if (f.t === T.csv) {
    node = el('input', { type: 'text', value: (obj[f.k] || []).join(', ') });
    node.oninput = () => {
      obj[f.k] = node.value.split(',').map(s => s.trim()).filter(Boolean);
      touch();
    };
  } else if (f.t === T.sel) {
    node = el('select');
    f.opts.forEach(o => node.append(el('option', { value: o, textContent: o, selected: obj[f.k] === o })));
    node.onchange = () => { obj[f.k] = node.value; touch(); };
  } else if (f.t === T.kv) {
    node = el('input', {
      type: 'text',
      value: Object.entries(obj[f.k] || {}).map(([k, v]) => k + '=' + v).join(', '),
    });
    node.oninput = () => {
      const out = {};
      node.value.split(',').forEach(pair => {
        const i = pair.indexOf('=');
        if (i > 0) out[pair.slice(0, i).trim()] = pair.slice(i + 1).trim();
      });
      obj[f.k] = out;
      touch();
    };
  } else if (f.t === T.objs) {
    wrap.append(objectTable(obj, f));
    return wrap;
  } else {
    node = el('input', { type: 'text', value: obj[f.k] == null ? '' : obj[f.k] });
    node.oninput = () => { obj[f.k] = node.value; touch(); };
  }
  wrap.append(node);
  return wrap;
}

function objectTable(obj, f) {
  const box = el('div', { className: 'sub' });
  const rows = obj[f.k] || (obj[f.k] = []);
  const table = el('table');
  if (rows.length) {
    const head = el('tr');
    f.sub.forEach(sf => head.append(el('td', { className: sf.t === T.bool ? 'narrow' : '' },
      [el('label', { textContent: sf.t === T.bool ? '' : sf.k })])));
    head.append(el('td', { className: 'narrow' }));
    table.append(head);
  }
  rows.forEach((row, i) => {
    const tr = el('tr');
    f.sub.forEach(sf => {
      const td = el('td', { className: sf.t === T.bool ? 'narrow' : '' });
      td.append(input(row, { ...sf, hint: null, wide: 0, nolabel: sf.t !== T.bool }));
      tr.append(td);
    });
    const rm = el('button', { className: 'rowbtn del', textContent: 'remove', type: 'button' });
    rm.onclick = () => { rows.splice(i, 1); touch(); render(); };
    tr.append(el('td', { className: 'narrow' }, [rm]));
    table.append(tr);
  });
  box.append(table);
  const add = el('button', { className: 'rowbtn', textContent: '+ add row', type: 'button' });
  add.onclick = () => { rows.push(structuredClone(f.blank)); touch(); render(); };
  box.append(add);
  return box;
}

function entryCard(spec, list, i) {
  const item = list[i];
  const card = el('div', { className: 'entry' });
  const head = el('div', { className: 'entry-head' });
  head.append(el('strong', { textContent: spec.name(item) }));
  const mk = (text, fn, cls) => {
    const b = el('button', { textContent: text, type: 'button', className: cls || '' });
    b.onclick = () => { fn(); touch(); render(); };
    return b;
  };
  if (i > 0) head.append(mk('↑', () => list.splice(i - 1, 0, list.splice(i, 1)[0])));
  if (i < list.length - 1) head.append(mk('↓', () => list.splice(i + 1, 0, list.splice(i, 1)[0])));
  head.append(mk('delete', () => list.splice(i, 1), 'del'));
  card.append(head);
  const grid = el('div', { className: 'grid' });
  spec.fields.forEach(f => grid.append(input(item, f)));
  card.append(grid);
  return card;
}

function render() {
  const nav = document.getElementById('nav');
  nav.textContent = '';
  SECTIONS.forEach(s => {
    const n = Array.isArray(data[s.key]) ? data[s.key].length : null;
    const b = el('button', { className: s.key === active ? 'on' : '' }, [s.label]);
    if (n !== null) b.append(el('span', { className: 'count', textContent: '  ' + n }));
    b.onclick = () => { active = s.key; render(); };
    nav.append(b);
  });

  const spec = SECTIONS.find(s => s.key === active);
  const main = document.getElementById('main');
  main.textContent = '';
  main.append(el('h2', { textContent: spec.label }));
  if (spec.hint) main.append(el('p', { className: 'hint', textContent: spec.hint }));

  if (spec.kind === 'object') {
    const grid = el('div', { className: 'grid' });
    spec.fields.forEach(f => grid.append(input(data[spec.key], f)));
    main.append(grid);
  } else {
    const list = data[spec.key] || (data[spec.key] = []);
    list.forEach((_, i) => main.append(entryCard(spec, list, i)));
    const add = el('button', { className: 'rowbtn', textContent: '+ add ' + spec.label.toLowerCase(), type: 'button' });
    add.onclick = () => { list.push(structuredClone(spec.blank)); touch(); render(); };
    main.append(add);
  }
  paintStatus();
}

function paintStatus() {
  const s = document.getElementById('status');
  s.textContent = dirty ? 'unsaved changes' : 'saved';
  s.className = dirty ? 'dirty' : '';
}

async function save() {
  const res = await fetch('/_data', { method: 'POST', body: JSON.stringify(data) });
  const out = await res.json();
  if (out.error) { showLog(out.error); return false; }
  dirty = false; paintStatus();
  return true;
}

function showLog(text) {
  const log = document.getElementById('log');
  log.textContent = text;
  log.style.display = text ? 'block' : 'none';
}

async function build() {
  if (!await save()) return;
  const btn = document.getElementById('build');
  btn.disabled = true; btn.textContent = 'building…';
  const out = await (await fetch('/_build', { method: 'POST' })).json();
  showLog(out.log);
  btn.disabled = false; btn.textContent = 'Save & build';
}

document.getElementById('save').onclick = save;
document.getElementById('build').onclick = build;
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

fetch('/_data').then(r => r.json()).then(d => { data = d; render(); });
</script>
</body>
</html>
